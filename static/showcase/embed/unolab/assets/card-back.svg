<svg width="80" height="120" viewBox="0 0 80 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6A5ACD;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#9370DB;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6A5ACD;stop-opacity:1" />
        </linearGradient>
        <pattern id="pattern" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="20" stroke="#FFD700" stroke-width="2" opacity="0.3"/>
        </pattern>
    </defs>
    
    <!-- 卡牌背景 -->
    <rect width="80" height="120" rx="8" ry="8" fill="url(#grad)"/>
    
    <!-- 装饰图案 -->
    <rect width="70" height="110" x="5" y="5" rx="6" ry="6" fill="url(#pattern)"/>
    
    <!-- 中心标志 -->
    <circle cx="40" cy="60" r="25" fill="none" stroke="#FFD700" stroke-width="3"/>
    <text x="40" y="70" text-anchor="middle" fill="#FFD700" font-size="24" font-family="Arial" font-weight="bold">UNO</text>
    
    <!-- 边框装饰 -->
    <rect width="76" height="116" x="2" y="2" rx="8" ry="8" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5"/>
</svg>