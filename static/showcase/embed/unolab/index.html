<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNO AI 实验室 - 深度学习卡牌游戏</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="game-lab-container">
      <!-- 头部区域 -->
      <header class="game-header">
        <div class="header-content">
          <div class="logo-area">
            <div class="logo-icon">
              <svg viewBox="0 0 100 100" class="logo-image">
                <circle
                  cx="50"
                  cy="50"
                  r="45"
                  fill="#6A5ACD"
                  stroke="#FFD700"
                  stroke-width="3"
                />
                <text
                  x="50"
                  y="70"
                  text-anchor="middle"
                  fill="white"
                  font-size="40"
                  font-family="Arial"
                >
                  UNO
                </text>
              </svg>
            </div>
            <div class="logo-text">
              <h1>UNO AI 实验室</h1>
              <p class="tagline">深度学习 · 强化学习 · 人工智能</p>
            </div>
          </div>
          <div class="ai-mode-selector">
            <label class="mode-toggle">
              <span class="mode-label">AI模式:</span>
              <select id="aiModeSelect" class="mode-select">
                <option value="rule-based">基于规则的人工智能</option>
                <option value="deep-learning" selected>深度学习人工智能</option>
              </select>
            </label>
          </div>
        </div>
      </header>

      <!-- 游戏主区域 -->
      <main class="game-main">
        <div class="game-play-area">
          <!-- 顶部行 - 3个AI玩家 -->
          <div class="top-row">
            <!-- 玩家5 -->
            <div class="player-section top-player" id="player5-section">
              <div class="player-info">
                <span class="player-name">玩家 5 (AI)</span>
                <span class="card-count" id="player5-count">7</span>
              </div>
              <div class="player-hand" id="player5-hand"></div>
            </div>

            <!-- 玩家4 -->
            <div class="player-section top-player" id="player4-section">
              <div class="player-info">
                <span class="player-name">玩家 4 (AI)</span>
                <span class="card-count" id="player4-count">7</span>
              </div>
              <div class="player-hand" id="player4-hand"></div>
            </div>

            <!-- 玩家3 -->
            <div class="player-section top-player" id="player3-section">
              <div class="player-info">
                <span class="player-name">玩家 3 (AI)</span>
                <span class="card-count" id="player3-count">7</span>
              </div>
              <div class="player-hand" id="player3-hand"></div>
            </div>
          </div>

          <!-- 中间行 -->
          <div class="middle-row">
            <!-- 左侧玩家6 -->
            <div class="player-section left-player" id="player6-section">
              <div class="player-info">
                <span class="player-name">玩家 6 (AI)</span>
                <span class="card-count" id="player6-count">7</span>
              </div>
              <div class="player-hand" id="player6-hand"></div>
            </div>

            <!-- 中央区域 -->
            <div class="center-area">
              <div class="game-controls">
                <button class="btn btn-primary" id="newGameBtn">新游戏</button>
                <button class="btn btn-secondary" id="drawCardBtn">摸牌</button>
                <button class="btn btn-accent" id="unoBtn">UNO!</button>
              </div>

              <div class="game-status" id="gameStatus">轮到玩家 1</div>

              <div class="piles-container">
                <div class="discard-pile" id="discardPile"></div>
                <div class="draw-pile" id="drawPile">
                  <div class="card card-back"></div>
                  <span class="pile-count" id="drawPileCount">108</span>
                </div>
              </div>
            </div>

            <!-- 右侧玩家2 -->
            <div class="player-section right-player" id="player2-section">
              <div class="player-info">
                <span class="player-name">玩家 2 (AI)</span>
                <span class="card-count" id="player2-count">7</span>
              </div>
              <div class="player-hand" id="player2-hand"></div>
            </div>
          </div>

          <!-- 底部行 - 人类玩家 -->
          <div class="bottom-row">
            <div class="player-section bottom-player" id="player1-section">
              <div class="player-info">
                <span class="player-name">玩家 1 (你) 👤</span>
                <span class="card-count" id="player1-count">7</span>
              </div>
              <div class="player-hand" id="player1-hand"></div>
            </div>
          </div>
        </div>
        <!-- 右侧信息面板 -->
        <div class="game-info-panel">
          <div class="panel-section">
            <h3>游戏信息</h3>
            <div class="info-item">
              <span class="info-label">当前颜色:</span>
              <span class="info-value" id="currentColor">红色</span>
            </div>
            <div class="info-item">
              <span class="info-label">当前数字/功能:</span>
              <span class="info-value" id="currentValue">0</span>
            </div>
            <div class="info-item">
              <span class="info-label">方向:</span>
              <span class="info-value" id="gameDirection">顺时针</span>
            </div>
            <div class="info-item">
              <span class="info-label">剩余牌数:</span>
              <span class="info-value" id="remainingCards">108</span>
            </div>
          </div>

          <div class="panel-section">
            <h3>AI 决策分析</h3>
            <div class="ai-decision-box" id="aiDecisionBox">
              <div class="decision-header">
                <span id="aiType">深度学习模型</span>
                <span class="confidence" id="aiConfidence">95%</span>
              </div>
              <div class="decision-reason" id="aiReason">
                选择红色 5 (胜率最高)
              </div>
              <div class="decision-probabilities" id="aiProbabilities">
                <!-- 概率条会在这里显示 -->
              </div>
            </div>
          </div>

          <div class="panel-section">
            <h3>深度学习指南</h3>
            <button class="btn btn-accent btn-small" id="showGuideBtn">
              查看详细说明
            </button>
          </div>
        </div>
      </main>

      <!-- 深度学习指南模态框 -->
      <div class="modal" id="guideModal">
        <div class="modal-content">
          <div class="modal-header">
            <h2>UNO 深度学习模型架构说明</h2>
            <button class="close-btn" id="closeGuideBtn">&times;</button>
          </div>
          <div class="modal-body" id="guideContent">
            <!-- 指南内容会通过JavaScript动态加载 -->
          </div>
        </div>
      </div>

      <!-- 颜色选择模态框 (用于万能牌) -->
      <div class="modal" id="colorSelectModal">
        <div class="modal-content small">
          <h3>选择颜色</h3>
          <div class="color-options">
            <button class="color-btn red" data-color="red">红色</button>
            <button class="color-btn blue" data-color="blue">蓝色</button>
            <button class="color-btn green" data-color="green">绿色</button>
            <button class="color-btn yellow" data-color="yellow">黄色</button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/cards.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/deep-learning-guide.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
