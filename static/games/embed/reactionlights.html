<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes"
    />
    <title>Reaction Start Lights</title>
    <style>
      :root {
        --track: #20242d;
        --track-dark: #13161d;
        --panel: #ffffff;
        --line: #d9dde8;
        --text: #202331;
        --muted: #687086;
        --red: #e0383e;
        --red-dark: #5e1519;
        --green: #22a967;
        --amber: #d59619;
        --blue: #2d66d8;
        --shadow: rgba(16, 20, 31, 0.18);
        --radius: 10px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: #eef1f6;
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
      }

      button {
        font: inherit;
      }

      .game {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(250px, 25vw, 310px);
        grid-template-rows: auto 1fr auto;
        grid-template-areas:
          "header header"
          "stage side"
          "keys side";
        gap: 14px 18px;
        padding: 18px;
        background:
          linear-gradient(90deg, transparent 0 47%, rgba(255, 255, 255, 0.3) 47% 53%, transparent 53%),
          repeating-linear-gradient(90deg, #eff2f7 0 52px, #e8ecf3 52px 104px);
      }

      .header {
        grid-area: header;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .title-group {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: 1.55rem;
        line-height: 1.1;
      }

      .subtitle {
        margin: 5px 0 0;
        color: var(--muted);
        font-weight: 650;
      }

      .round-pill {
        flex: 0 0 auto;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--blue);
        font-weight: 900;
        box-shadow: 0 8px 18px rgba(21, 31, 52, 0.08);
      }

      .stage {
        grid-area: stage;
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 16px;
        min-height: 0;
        padding: clamp(16px, 2vw, 24px);
        border-radius: var(--radius);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.09), transparent 42%),
          var(--track);
        color: white;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 16px 35px var(--shadow);
        cursor: pointer;
        user-select: none;
      }

      .gantry {
        display: grid;
        gap: 14px;
        justify-items: center;
        align-self: start;
      }

      .light-bar {
        display: grid;
        grid-template-columns: repeat(5, minmax(74px, 1fr));
        gap: clamp(10px, 1.7vw, 18px);
        width: min(100%, 670px);
        padding: 18px;
        border: 2px solid #3a3f4c;
        border-radius: var(--radius);
        background: linear-gradient(180deg, #10131a, #050608);
        box-shadow: 0 18px 32px rgba(0, 0, 0, 0.36);
      }

      .light-cell {
        display: grid;
        place-items: center;
        aspect-ratio: 1 / 1;
        border-radius: 8px;
        background: #171a22;
        box-shadow: inset 0 0 0 1px #323743;
      }

      .lamp {
        width: 66%;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #453238, #1a0d10 70%);
        box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.8);
      }

      .lamp.on {
        background: radial-gradient(circle at 35% 28%, #fff0ef 0 9%, #ff6b69 18%, var(--red) 54%, #821a1f 100%);
        box-shadow: 0 0 20px rgba(224, 56, 62, 0.82), 0 0 42px rgba(224, 56, 62, 0.42);
      }

      .lamp.go {
        background: radial-gradient(circle at 35% 28%, #eafff4 0 9%, #8ff1bb 20%, var(--green) 58%, #12643b 100%);
        box-shadow: 0 0 22px rgba(34, 169, 103, 0.9), 0 0 44px rgba(34, 169, 103, 0.45);
      }

      .message-panel {
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 10px;
        min-height: 190px;
        text-align: center;
      }

      .status {
        margin: 0;
        color: #f6f7fb;
        font-size: clamp(1.4rem, 3.3vw, 2.55rem);
        font-weight: 950;
        line-height: 1.08;
      }

      .hint {
        max-width: 620px;
        min-height: 28px;
        margin: 0;
        color: #c7cede;
        font-size: 1rem;
        font-weight: 700;
      }

      .big-result {
        min-height: 82px;
        color: white;
        font-size: clamp(3rem, 8vw, 5.9rem);
        font-weight: 950;
        line-height: 1;
        letter-spacing: 0;
      }

      .track-lane {
        position: relative;
        height: 92px;
        overflow: hidden;
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.9) 0 7px, transparent 7px),
          repeating-linear-gradient(90deg, transparent 0 54px, rgba(255, 255, 255, 0.22) 54px 86px, transparent 86px 132px),
          linear-gradient(180deg, #313743, #20242d);
      }

      .car {
        position: absolute;
        left: 26px;
        bottom: 20px;
        width: 132px;
        height: 34px;
        border-radius: 7px 18px 6px 7px;
        background: linear-gradient(135deg, #2e77f0, #17449f);
        box-shadow: 0 12px 18px rgba(0, 0, 0, 0.28);
        transition: transform 680ms cubic-bezier(0.16, 0.95, 0.38, 1);
      }

      .car::before {
        content: "";
        position: absolute;
        left: 38px;
        top: -17px;
        width: 48px;
        height: 20px;
        border-radius: 12px 14px 0 0;
        background: #8fc2ff;
        box-shadow: inset 12px 0 0 rgba(255, 255, 255, 0.42);
      }

      .car::after {
        content: "";
        position: absolute;
        left: 16px;
        right: 18px;
        bottom: -8px;
        height: 16px;
        border-radius: 999px;
        background:
          radial-gradient(circle at 16px 8px, #111 0 8px, transparent 9px),
          radial-gradient(circle at calc(100% - 16px) 8px, #111 0 8px, transparent 9px);
      }

      .car.launch {
        transform: translateX(min(58vw, 630px));
      }

      .side {
        grid-area: side;
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 12px;
        min-height: 0;
      }

      .controls,
      .stats,
      .history {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: 0 10px 24px rgba(21, 31, 52, 0.08);
      }

      .controls {
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .btn {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        background: var(--blue);
        color: white;
        font-weight: 900;
        cursor: pointer;
      }

      .btn:hover {
        background: #1f52b8;
      }

      .btn.secondary {
        background: #eef2f8;
        color: var(--text);
        border: 1px solid var(--line);
      }

      .btn.secondary:hover {
        background: #e1e7f1;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 12px;
      }

      .stat {
        min-height: 70px;
        padding: 10px 8px;
        border-radius: 8px;
        background: #f7f9fc;
        text-align: center;
      }

      .label {
        display: block;
        color: var(--muted);
        font-size: 0.73rem;
        font-weight: 850;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .value {
        display: block;
        margin-top: 5px;
        color: var(--text);
        font-size: 1.33rem;
        font-weight: 950;
      }

      .history {
        min-height: 0;
        padding: 12px;
      }

      .history h2 {
        margin: 0 0 10px;
        font-size: 0.98rem;
      }

      .history-list {
        display: grid;
        gap: 8px;
        max-height: 196px;
        overflow: auto;
      }

      .history-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 8px;
        background: #f7f9fc;
        color: var(--muted);
        font-weight: 800;
      }

      .history-row strong {
        color: var(--text);
      }

      .history-row.false-start strong {
        color: #b8333a;
      }

      .keys {
        grid-area: keys;
        align-self: end;
        color: #5c6578;
        font-size: 0.9rem;
        font-weight: 700;
        text-align: center;
      }

      .key {
        display: inline-block;
        min-width: 28px;
        margin: 2px;
        padding: 2px 7px;
        border: 1px solid #cdd4df;
        border-radius: 6px;
        background: white;
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-weight: 900;
      }

      @media (max-width: 860px) {
        body {
          overflow: auto;
        }

        .game {
          min-height: 100vh;
          grid-template-columns: 1fr;
          grid-template-rows: auto auto auto auto;
          grid-template-areas:
            "header"
            "stage"
            "side"
            "keys";
          overflow-y: auto;
          padding: 14px;
        }

        .header {
          align-items: flex-start;
          flex-direction: column;
        }

        .light-bar {
          grid-template-columns: repeat(5, 1fr);
          padding: 12px;
        }

        .side {
          grid-template-rows: auto;
        }

        .history-list {
          max-height: 150px;
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <header class="header">
        <div class="title-group">
          <h1>Reaction Start Lights</h1>
          <p class="subtitle">Wait for lights out, then press the mouse or Space.</p>
        </div>
        <span class="round-pill" id="roundLabel">Round 0 / 5</span>
      </header>

      <section class="stage" id="stage" aria-label="Reaction test area" tabindex="0">
        <div class="gantry">
          <div class="light-bar" aria-label="Start lights">
            <div class="light-cell"><div class="lamp" data-lamp="0"></div></div>
            <div class="light-cell"><div class="lamp" data-lamp="1"></div></div>
            <div class="light-cell"><div class="lamp" data-lamp="2"></div></div>
            <div class="light-cell"><div class="lamp" data-lamp="3"></div></div>
            <div class="light-cell"><div class="lamp" data-lamp="4"></div></div>
          </div>
        </div>

        <div class="message-panel">
          <p class="status" id="statusText">Ready on the grid.</p>
          <div class="big-result" id="resultText">-</div>
          <p class="hint" id="hintText">Press Start, then wait. The final pause is random.</p>
        </div>

        <div class="track-lane" aria-hidden="true">
          <div class="car" id="car"></div>
        </div>
      </section>

      <aside class="side" aria-label="Game controls and results">
        <section class="controls">
          <button class="btn" id="startButton" type="button">Start Round</button>
          <button class="btn secondary" id="resetButton" type="button">Reset Results</button>
        </section>

        <section class="stats" aria-label="Statistics">
          <div class="stat">
            <span class="label">Last</span>
            <span class="value" id="lastStat">-</span>
          </div>
          <div class="stat">
            <span class="label">Best</span>
            <span class="value" id="bestStat">-</span>
          </div>
          <div class="stat">
            <span class="label">Average</span>
            <span class="value" id="avgStat">-</span>
          </div>
          <div class="stat">
            <span class="label">False Starts</span>
            <span class="value" id="falseStat">0</span>
          </div>
        </section>

        <section class="history">
          <h2>Round History</h2>
          <div class="history-list" id="historyList">
            <div class="history-row"><span>No rounds yet</span><strong>-</strong></div>
          </div>
        </section>
      </aside>

      <div class="keys">
        <span class="key">Space</span> react
        <span class="key">Enter</span> start
        <span class="key">Esc</span> reset
      </div>
    </main>

    <script>
      (function () {
        "use strict";

        const ROUND_TARGET = 5;
        const LIGHT_INTERVAL = 650;
        const RANDOM_DELAY_MIN = 850;
        const RANDOM_DELAY_MAX = 3100;

        const lamps = Array.from(document.querySelectorAll(".lamp"));
        const stage = document.getElementById("stage");
        const car = document.getElementById("car");
        const startButton = document.getElementById("startButton");
        const resetButton = document.getElementById("resetButton");
        const statusText = document.getElementById("statusText");
        const resultText = document.getElementById("resultText");
        const hintText = document.getElementById("hintText");
        const roundLabel = document.getElementById("roundLabel");
        const lastStat = document.getElementById("lastStat");
        const bestStat = document.getElementById("bestStat");
        const avgStat = document.getElementById("avgStat");
        const falseStat = document.getElementById("falseStat");
        const historyList = document.getElementById("historyList");

        let state = "idle";
        let timeouts = [];
        let lightsOutAt = 0;
        let roundNumber = 0;
        let results = [];
        let falseStarts = 0;

        function setText(status, result, hint) {
          statusText.textContent = status;
          resultText.textContent = result;
          hintText.textContent = hint;
        }

        function clearTimers() {
          timeouts.forEach(function (id) {
            clearTimeout(id);
          });
          timeouts = [];
        }

        function wait(ms, callback) {
          const id = setTimeout(callback, ms);
          timeouts.push(id);
        }

        function randomDelay() {
          return (
            RANDOM_DELAY_MIN +
            Math.floor(Math.random() * (RANDOM_DELAY_MAX - RANDOM_DELAY_MIN + 1))
          );
        }

        function clearLamps() {
          lamps.forEach(function (lamp) {
            lamp.classList.remove("on", "go");
          });
        }

        function setGoLamps() {
          lamps.forEach(function (lamp) {
            lamp.classList.remove("on");
            lamp.classList.add("go");
          });
        }

        function formatMs(value) {
          return Math.round(value) + " ms";
        }

        function validResults() {
          return results.filter(function (entry) {
            return !entry.falseStart;
          });
        }

        function updateRoundLabel() {
          const visibleRound = Math.min(roundNumber, ROUND_TARGET);
          roundLabel.textContent = "Round " + visibleRound + " / " + ROUND_TARGET;
        }

        function updateStats() {
          const valid = validResults();
          const last = results[results.length - 1];

          lastStat.textContent = last
            ? last.falseStart
              ? "False"
              : formatMs(last.time)
            : "-";
          bestStat.textContent = valid.length
            ? formatMs(
                Math.min.apply(
                  null,
                  valid.map(function (entry) {
                    return entry.time;
                  }),
                ),
              )
            : "-";
          avgStat.textContent = valid.length
            ? formatMs(
                valid.reduce(function (sum, entry) {
                  return sum + entry.time;
                }, 0) / valid.length,
              )
            : "-";
          falseStat.textContent = String(falseStarts);

          renderHistory();
          updateRoundLabel();
        }

        function renderHistory() {
          historyList.innerHTML = "";
          if (!results.length) {
            const empty = document.createElement("div");
            empty.className = "history-row";
            empty.innerHTML = "<span>No rounds yet</span><strong>-</strong>";
            historyList.appendChild(empty);
            return;
          }

          results.slice(-8).reverse().forEach(function (entry) {
            const row = document.createElement("div");
            row.className = "history-row" + (entry.falseStart ? " false-start" : "");
            const label = document.createElement("span");
            const value = document.createElement("strong");
            label.textContent = "Round " + entry.round;
            value.textContent = entry.falseStart ? "False start" : formatMs(entry.time);
            row.appendChild(label);
            row.appendChild(value);
            historyList.appendChild(row);
          });
        }

        function finishSetIfNeeded() {
          if (roundNumber < ROUND_TARGET) return false;

          state = "complete";
          startButton.textContent = "Start New Set";
          const valid = validResults();
          if (!valid.length) {
            setText(
              "Set complete.",
              "-",
              "All attempts were false starts. Reset or start a new set.",
            );
            return true;
          }

          const best = Math.min.apply(
            null,
            valid.map(function (entry) {
              return entry.time;
            }),
          );
          const average =
            valid.reduce(function (sum, entry) {
              return sum + entry.time;
            }, 0) / valid.length;
          setText(
            "Set complete.",
            formatMs(best),
            "Best time shown. Average: " + formatMs(average) + ".",
          );
          return true;
        }

        function startRound() {
          if (state === "counting" || state === "waiting") return;
          if (state === "complete") resetResults();

          clearTimers();
          clearLamps();
          car.classList.remove("launch");
          void car.offsetWidth;

          state = "counting";
          lightsOutAt = 0;
          roundNumber += 1;
          updateRoundLabel();
          startButton.textContent = "Round Running";
          setText("Watch the lights.", "-", "React only after every light goes out.");

          lamps.forEach(function (lamp, index) {
            wait(LIGHT_INTERVAL * (index + 1), function () {
              if (state !== "counting") return;
              lamp.classList.add("on");
            });
          });

          wait(LIGHT_INTERVAL * lamps.length + randomDelay(), function () {
            if (state !== "counting") return;
            state = "waiting";
            lightsOutAt = performance.now();
            clearLamps();
            setGoLamps();
            setText("Go!", "-", "Press the mouse or Space now.");
          });
        }

        function recordFalseStart() {
          clearTimers();
          clearLamps();
          state = "idle";
          falseStarts += 1;
          results.push({ round: roundNumber, falseStart: true, time: null });
          setText("False start.", "Too early", "Wait until the lights go out.");
          startButton.textContent = finishSetIfNeeded() ? "Start New Set" : "Try Next Round";
          updateStats();
        }

        function react() {
          if (state === "idle" || state === "complete") {
            startRound();
            return;
          }

          if (state === "counting") {
            recordFalseStart();
            return;
          }

          if (state !== "waiting") return;

          const reaction = performance.now() - lightsOutAt;
          state = "idle";
          clearTimers();
          setGoLamps();
          car.classList.add("launch");
          results.push({ round: roundNumber, falseStart: false, time: reaction });
          setText("Reaction time", formatMs(reaction), reaction < 180 ? "Very sharp." : "Press Start for the next round.");
          startButton.textContent = finishSetIfNeeded() ? "Start New Set" : "Next Round";
          updateStats();
        }

        function resetResults() {
          clearTimers();
          clearLamps();
          car.classList.remove("launch");
          state = "idle";
          lightsOutAt = 0;
          roundNumber = 0;
          results = [];
          falseStarts = 0;
          startButton.textContent = "Start Round";
          setText("Ready on the grid.", "-", "Press Start, then wait. The final pause is random.");
          updateStats();
        }

        function handleKeydown(event) {
          if (event.code === "Space") {
            event.preventDefault();
            react();
          } else if (event.key === "Enter") {
            event.preventDefault();
            startRound();
          } else if (event.key === "Escape") {
            event.preventDefault();
            resetResults();
          }
        }

        stage.addEventListener("pointerdown", function (event) {
          if (event.button !== 0) return;
          event.preventDefault();
          stage.focus({ preventScroll: true });
          react();
        });
        startButton.addEventListener("click", startRound);
        resetButton.addEventListener("click", resetResults);
        window.addEventListener("keydown", handleKeydown);
        updateStats();
      })();
    </script>
  </body>
</html>
